# ==============================================================================
# AI Security Analysis Platform - Production Profile Configuration
# ==============================================================================
# Activated when: spring.profiles.active=prod
# Purpose: Hardened, secure production settings.
# All secrets MUST be provided via environment variables — never hardcoded.
# ==============================================================================

spring:

  # ----------------------------------------------------------------------------
  # PRODUCTION MYSQL DATASOURCE (Aiven or any SSL-enabled MySQL)
  # ----------------------------------------------------------------------------
  # All three variables MUST be set in the deployment environment.
  # DB_URL format: jdbc:mysql://<host>:<port>/<dbname>?sslMode=REQUIRED&serverTimezone=UTC&...
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 1
      maximum-pool-size: 10
      idle-timeout: 120000
      connection-timeout: 20000
      initialization-fail-timeout: 20000
      max-lifetime: 600000
      connection-test-query: SELECT 1
      pool-name: AiSecurityProdPool

  # ----------------------------------------------------------------------------
  # JPA / HIBERNATE — strict production settings
  # ----------------------------------------------------------------------------
  jpa:
    hibernate:
      ddl-auto: update             # adds new columns; never drops existing data
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  # ----------------------------------------------------------------------------
  # MAIL — production SMTP
  # ----------------------------------------------------------------------------
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: false
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

  # ----------------------------------------------------------------------------
  # MULTIPART — production overrides for Render
  # ----------------------------------------------------------------------------
  servlet:
    multipart:
      enabled: true
      max-file-size: 20MB
      max-request-size: 100MB
      file-size-threshold: 2KB
      location: /tmp/uploads

# ==============================================================================
# SERVER — production hardening
# ==============================================================================
server:
  port: ${PORT:8080}
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html,text/plain
    min-response-size: 1024

# ==============================================================================
# LOGGING — clean console output for cloud container runtime
# ==============================================================================
logging:
  level:
    root: INFO
    com.sanjay.aisecurity: INFO
    com.zaxxer.hikari: INFO
    org.springframework.boot.web.embedded.tomcat: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN

# ==============================================================================
# APPLICATION PRODUCTION OVERRIDES
# ==============================================================================
app:
  frontend:
    base-url: ${APP_FRONTEND_URL:https://codesentry-wheat.vercel.app}
  upload:
    base-dir: ${UPLOAD_DIR:/data/ai-security/uploads}
  jwt:
    secret: ${JWT_SECRET}
    expiration: ${JWT_EXPIRATION:86400000}
  ai:
    groq:
      api-key: ${GROQ_API_KEY:}
      timeout-seconds: 90
      max-tokens: 4096
      chat-max-tokens: 2500
      enrichment-max-tokens: 4096
      temperature: 0.2
    gemini:
      api-key: ${GEMINI_API_KEY:}
  mail:
    from-address: ${MAIL_FROM_ADDRESS}
    from-name: ${MAIL_FROM_NAME:CodeSentry Support}

ai:
  retry:
    max-attempts: 3
    delay: 5000
    exponential-backoff: true


# Security / CORS overrides
cors:
  allowed-origins: ${APP_FRONTEND_URL:https://codesentry-wheat.vercel.app},http://localhost:5173
  allowed-origin-patterns: https://*.vercel.app,https://*.onrender.com
